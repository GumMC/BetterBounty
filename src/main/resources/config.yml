settings:
  maximum-bounty: 100000000 # 100 million, set to -1 for no limit
  minimum-bounty: 10000
  skip-confirm-gui: true
  search-enabled: false
  
  # Tax system for bounty claims (disabled by default)
  tax: 5 # Tax percentage applied to bounty claims. Set to -1 or below to disable, 0+ to enable (e.g., 10 = 10% tax)
  
  # Block placing bounties on players with bad stats
  stat-blocking:
    enabled: false # Set to true to enable stat-based bounty blocking
    mode: "kd" # "kd" for K/D ratio or "deaths" for maximum deaths
    minimum-kd: 0.5 # Minimum K/D ratio required (only used if mode is "kd")
    maximum-deaths: 100 # Maximum deaths allowed (only used if mode is "deaths")

  commands:
    - "bounty"
    - "bounties"

  sounds:
    success: "minecraft:entity.player.levelup"
    fail: "minecraft:entity.villager.no"
    claim: "minecraft:block.beacon.power_select"
    cancel: "minecraft:block.tripwire.click_on"

messages:
  no-perm:
    - "<#FF5C5C><bold>(!)</bold> Not enough permission."
  invalid-command:
    - "<#FF5C5C><bold>(!)</bold> Invalid or wrong command. (or argument)"
  player-not-found:
    - "<#FF5C5C><bold>(!)</bold> Target player not found."
  reload:
    - "<#5CFF7A><bold>(!)</bold> Successfully reloaded."

  click-cooldown:
    - "<#FFD65C><bold>(!)</bold> You must wait a few seconds before clicking again."

  no-bounty:
    - "<#B0B0B0><bold>(!)</bold> This player has no bounty set."
  bounty-removed:
    - "<#5CFF7A><bold>(!)</bold> Bounty removed successfully."

  bounty-claimed:
    - "<#5CFF7A><bold>(!)</bold> <killer> claimed a <bold><#B8FFD0>$<amount><#5CFF7A></bold> bounty for killing <#B8FFD0><player><#5CFF7A>!"
    - "<#B0B0B0>Type <#E0E0E0>/bounty<#B0B0B0> to add a bounty to a player's head"

  bounty-added:
    - "<#FF5C5C><bold>(!)</bold> You added <#FFBDBD><amount><#FF5C5C> to <#FFBDBD><player><#FF5C5C>'s bounty."
  bounty-added-to-you:
    - "<#5CFF7A><bold>(!)</bold> <#B8FFD0><player><#5CFF7A> added <#B8FFD0><amount><#5CFF7A> to your bounty."

  not-enough-money:
    - "<#FF5C5C><bold>(!)</bold> Not enough money to set this bounty."
  minimum-bounty:
    - "<#FF5C5C><bold>(!)</bold> Minimum bounty is <#FFBDBD><amount><#FF5C5C>."
  maximum-bounty:
    - "<#FF5C5C><bold>(!)</bold> Maximum bounty is <#FFBDBD><amount><#FF5C5C>."
  
  bad-stats-kd:
    - "<#FF5C5C><bold>(!)</bold> Cannot place bounty on this player - their K/D ratio is too low (<#FFBDBD><kd><#FF5C5C>, minimum: <#FFBDBD><min_kd><#FF5C5C>)."
  bad-stats-deaths:
    - "<#FF5C5C><bold>(!)</bold> They have too many deaths (<#FFBDBD><deaths><#FF5C5C>, maximum: <#FFBDBD><max_deaths><#FF5C5C>)."
  cannot-add-yourself:
    - "<#FF5C5C><bold>(!)</bold> You cannot place a bounty on yourself."
  sort-types:
    AMOUNT: "<#03fcb1>Amount</#03fcb1>"
    LAST_UPDATED: "<#03fcb1>Recently Set</#03fcb1>"
    NAME: "<#03fcb1>Name</#03fcb1>"

  sign:
    material: "OAK_WALL_SIGN"
    color: "BLACK"
    glow: true
    lines:
      - ""
      - "^^^^^^^^"
      - "Search"
      - ""

